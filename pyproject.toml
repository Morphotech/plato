[tool.poetry]
name = "plato"
version = "2026.3.1"
description = "Templating as a microservice"
authors = [
  "Tiago Santos",
  "Joana Teixeira <joana.teixeira@morphotech.com>",
  "Rita Mariquitos <rita.mariquitos@morphotech.com>",
  "Fábio André Damas <fabio.damas@morphotech.com>",
  "Pedro Alves <pedro.alves@morphotech.com>"
]
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"

fastapi = { extras = ["standard"], version = "^0.141.1" }
pydantic-settings = "^2.15.0"
python-json-logger = "^3.2"
gunicorn = "^23.0.0"
sqlalchemy = { version = "^2.0.52", extras = ["postgresql_psycopg2binary"] }
alembic = "1.19.1"
jsonschema = "^4.26.0"
smart-open = { version = "8.0.1", extras = ["s3", "gcs"] }
psycopg2-binary = "^2.9.10"
alembic = "^1.16.2"
jsonschema = "^4.24.0"
smart-open = { version = "6.4.0", extras = ["s3", "gcs"] }

# Database
sqlalchemy = { version = "^2.0", extras = ["postgresql_psycopg2binary"] }

#HTTP
accept-types = "0.4.1"

# Templating
WeasyPrint = "69.0"
qrcode = { version = "8.2", extras = ["pil"] }
babel = "^2.18.0"
num2words = "0.5.14"
jmespath = "^1.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "~9.1.1"
coverage = "~7.16.0"
testcontainers = "^4.15.0"
blinker = "1.9.0"
pypdf = "^6.16.2"

[build-system]
requires = ["poetry>=1.2"]
build-backend = "poetry.masonry.api"
